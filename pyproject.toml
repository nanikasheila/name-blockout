[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "name-blockout"
version = "0.1.0"
description = "ネームの指示から Blender で背景の Blockout（あたり）を組み、数値で確かめる"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Checks against the JSON Schema (without it, only the basic shape is checked).
schema = ["jsonschema>=4.18"]
# Blender as a Python module, to run the Blender parts without a Blender install (tests, CI).
blender = ["bpy==5.2.*"]
test = ["pytest>=8", "jsonschema>=4.18"]

[project.scripts]
name-blockout = "name_blockout.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/name_blockout"]

[tool.hatch.build.targets.wheel.force-include]
"schema" = "name_blockout/schema"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741", "B905"]
