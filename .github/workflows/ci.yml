name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install (with Blender as a module)
        run: pip install -e ".[test,blender]" ruff
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Tests (the Blender ones included)
        run: pytest -q
      - name: Blockout of the examples
        run: |
          for f in examples/*/指示.json; do
            python -m name_blockout check "$f"
            python -m name_blockout blockout "$f" --dpi 100
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: examples-blockout
          path: |
            examples/*/案/
            examples/*/blockout/*/*/check.json
